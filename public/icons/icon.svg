<!-- ricebread のロゴ(値札)。scripts/generate-icons.mjs が描く形と同じもの。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <!-- 紐を通す穴。値札の本体から抜く -->
    <mask id="hole">
      <rect x="0" y="0" width="512" height="512" fill="#fff" />
      <circle cx="310" cy="256" r="20" fill="#000" />
    </mask>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#brand)" />
  <!-- 角丸の正方形を 45 度傾けて「札」に見せる -->
  <rect
    x="144" y="144" width="224" height="224" rx="36"
    fill="#fff"
    mask="url(#hole)"
    transform="rotate(-45 256 256)"
  />
</svg>
